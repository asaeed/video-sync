<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Sync · Favicon options</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #090d0f; color: #edf2f3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1040px; margin: auto; padding: 28px 20px 48px; }
    h1 { margin: 0 0 6px; font-size: 27px; letter-spacing: -.025em; }
    p { margin: 0; color: #a3afb4; line-height: 1.5; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 25px; }
    .palette { display: flex; gap: 16px; flex-wrap: wrap; white-space: nowrap; font-size: 13px; font-weight: 650; }
    .palette span { display: inline-flex; align-items: center; gap: 7px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; }
    .live-swatch { background: #f4b66a; }
    .studio-swatch { background: #9bd9e8; }
    #options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    article { min-width: 0; padding: 16px; border: 1px solid #2b383e; border-radius: 12px; background: #11181b; }
    .card-title { display: flex; align-items: baseline; gap: 9px; margin-bottom: 12px; }
    .number { color: #82929a; font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 750; }
    h2 { margin: 0; font-size: 16px; }
    .current { margin-left: auto; color: #c2e9f2; background: #214049; border-radius: 30px; padding: 3px 8px; font-size: 11px; font-weight: 700; }
    .variants { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .variant { display: flex; align-items: center; min-width: 0; gap: 9px; padding: 10px; background: #0b1114; border-radius: 8px; }
    .variant.live { color: #f4b66a; }
    .variant.studio { color: #9bd9e8; }
    .icon { display: block; flex: 0 0 auto; width: 52px; height: 52px; }
    .mini { display: block; flex: 0 0 auto; width: 16px; height: 16px; }
    .variant-label { min-width: 0; color: #cdd8dc; font-size: 12px; line-height: 1.25; }
    .variant-label small { display: block; color: #85969e; font-size: 11px; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    @media (max-width: 760px) { header { display: block; } .palette { margin-top: 16px; } #options { grid-template-columns: 1fr; } }
    @media (max-width: 380px) { main { padding-inline: 12px; } article { padding: 12px; } .variant { gap: 5px; padding: 7px; } .icon { width: 42px; height: 42px; } .mini { width: 14px; height: 14px; } }
  </style>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="frames" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="10" y="10" width="35" height="35" rx="5" fill="none" stroke="currentColor" stroke-width="5" opacity=".65"/>
      <rect x="20" y="20" width="34" height="34" rx="5" fill="#0d1418" stroke="currentColor" stroke-width="5"/>
      <path d="M32 29v16l12-8z" fill="currentColor"/>
    </symbol>
    <symbol id="pulse" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <path d="M14 14v36l25-18z" fill="currentColor"/>
      <path d="M45 22v20M52 16v32" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <symbol id="orbit" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <path d="M16 30a17 17 0 0 1 30-11M48 34a17 17 0 0 1-30 11" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path d="M42 14l8 6-10 4M22 50l-8-6 10-4" fill="currentColor"/>
      <circle cx="32" cy="32" r="5" fill="currentColor"/>
    </symbol>
    <symbol id="crossfade" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <path d="M10 13v38l25-19z" fill="currentColor"/>
      <path d="M54 13v38L29 32z" fill="currentColor" opacity=".55"/>
      <path d="M32 15v34" stroke="#0d1418" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="beat-grid" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="11" y="11" width="18" height="18" rx="3" fill="currentColor"/>
      <rect x="35" y="11" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="5"/>
      <rect x="11" y="35" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="5"/>
      <rect x="35" y="35" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="5"/>
    </symbol>
    <symbol id="cue-spark" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <path d="M32 9l5.5 17.5L55 32l-17.5 5.5L32 55l-5.5-17.5L9 32l17.5-5.5z" fill="currentColor"/>
      <circle cx="32" cy="32" r="6" fill="#0d1418"/>
    </symbol>
    <symbol id="vee" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <path d="M12 16l20 32 20-32" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 13h8M35 13h8" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".65"/>
    </symbol>
    <symbol id="film-gate" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="10" y="14" width="44" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="5"/>
      <path d="M18 17v30M46 17v30" stroke="currentColor" stroke-width="4" opacity=".55"/>
      <path d="M27 22v20l14-10z" fill="currentColor"/>
    </symbol>
    <symbol id="phase" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <circle cx="25" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="6"/>
      <circle cx="39" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="6" opacity=".65"/>
      <circle cx="32" cy="32" r="4" fill="currentColor"/>
    </symbol>
    <symbol id="timeline" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <path d="M11 38h42" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path d="M15 31v14M26 33v10M38 33v10M49 31v14" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".65"/>
      <path d="M32 12l9 11-9 11-9-11z" fill="currentColor"/>
    </symbol>
    <symbol id="inset-frame" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="10" y="10" width="44" height="44" rx="7" fill="currentColor"/>
      <rect x="18" y="18" width="28" height="28" rx="3" fill="#0d1418"/>
      <rect x="34" y="34" width="12" height="12" rx="2" fill="currentColor"/>
    </symbol>
    <symbol id="scene-stack" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="10" y="11" width="35" height="13" rx="3" fill="currentColor" opacity=".6"/>
      <rect x="19" y="25" width="35" height="13" rx="3" fill="currentColor"/>
      <rect x="10" y="39" width="35" height="13" rx="3" fill="currentColor" opacity=".8"/>
    </symbol>
    <symbol id="splice" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="10" y="12" width="44" height="40" rx="5" fill="currentColor"/>
      <path d="M31 12v13l-6 7 12 8-6 12" fill="none" stroke="#0d1418" stroke-width="6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="portal" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="9" y="9" width="46" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="5" opacity=".6"/>
      <rect x="19" y="19" width="26" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="5"/>
      <rect x="28" y="28" width="8" height="8" rx="1" fill="currentColor"/>
    </symbol>
    <symbol id="viewfinder" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <path d="M25 12H12v13M39 12h13v13M12 39v13h13M52 39v13H39" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 23l9 9-9 9-9-9z" fill="currentColor"/>
    </symbol>
    <symbol id="film-window" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="9" y="13" width="46" height="38" rx="4" fill="currentColor"/>
      <rect x="20" y="20" width="24" height="24" rx="2" fill="#0d1418"/>
      <path d="M14 20h2M14 29h2M14 38h2M48 20h2M48 29h2M48 38h2" stroke="#0d1418" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="negative-v" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="10" y="10" width="44" height="44" rx="7" fill="currentColor"/>
      <path d="M19 22l13 20 13-20" fill="none" stroke="#0d1418" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="jump-cut" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="10" y="10" width="29" height="29" rx="4" fill="currentColor" opacity=".65"/>
      <rect x="25" y="25" width="29" height="29" rx="4" fill="currentColor"/>
      <path d="M31 25v14h-6" fill="none" stroke="#0d1418" stroke-width="4"/>
    </symbol>
    <symbol id="cue-notch" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <rect x="11" y="13" width="42" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="6"/>
      <path d="M25 11h14v18l-7-6-7 6z" fill="currentColor"/>
      <path d="M23 40h18" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    </symbol>
    <symbol id="frame-return" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0d1418"/>
      <path d="M50 32V13H14v38h25" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 39l12 12-12 6" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>
  <main>
    <header>
      <div><h1>Favicon directions</h1><p>One mark, two colors. Each concept appears at icon size and actual 16px tab size.</p></div>
      <div class="palette" aria-label="App colors"><span><i class="swatch live-swatch"></i>Live Console</span><span><i class="swatch studio-swatch"></i>Scene Studio</span></div>
    </header>
    <div id="options" aria-label="Ten favicon options"></div>
  </main>
  <script>
    const options = [
      ["frames", "Stacked frames"], ["pulse", "Play + pulse"],
      ["orbit", "Sync orbit"], ["crossfade", "Crossfade"],
      ["beat-grid", "Beat grid"], ["cue-spark", "Cue spark"],
      ["vee", "Video V"], ["film-gate", "Film gate"],
      ["phase", "Dual phase"], ["timeline", "Timeline cue"],
      ["inset-frame", "Inset frame"], ["scene-stack", "Scene stack"],
      ["splice", "Splice"], ["portal", "Portal"],
      ["viewfinder", "Viewfinder"], ["film-window", "Film window"],
      ["negative-v", "Negative V"], ["jump-cut", "Jump cut"],
      ["cue-notch", "Cue notch"], ["frame-return", "Frame return"],
    ];
    const round = new URLSearchParams(location.search).get("round") === "2" ? 2 : 1;
    if (round === 2) {
      document.querySelector("h1").textContent = "Favicon directions · 11–20";
      document.title = "Video Sync · More favicon options";
    }
    document.getElementById("options").setAttribute("aria-label", `Favicon options ${round === 2 ? "11 through 20" : "1 through 10"}`);
    document.getElementById("options").innerHTML = options.slice((round - 1) * 10, round * 10).map(([id, name], position) => {
      const index = position + (round - 1) * 10;
      return `
      <article>
        <div class="card-title"><span class="number">${String(index + 1).padStart(2, "0")}</span><h2>${name}</h2>${index === 15 ? '<span class="current">In use</span>' : ''}</div>
        <div class="variants">
          ${[["live", "Live Console"], ["studio", "Scene Studio"]].map(([variant, label]) => `
            <div class="variant ${variant}">
              <svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><use href="#${id}"/></svg>
              <svg class="mini" viewBox="0 0 64 64" aria-hidden="true"><use href="#${id}"/></svg>
              <span class="variant-label">${label}<small>${variant === "live" ? "amber" : "cyan"}</small></span>
            </div>`).join("")}
        </div>
      </article>`;
    }).join("");
  </script>
</body>
</html>
